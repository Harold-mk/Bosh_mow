[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bosh-mow"
version = "0.1.0"
description = "A personal, local and free desktop app to learn your courses."
readme = "README.md"
license = "MIT"
authors = [{ name = "Harold Mokam" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pywebview",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/bosh_mow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["backend"]  # where bosh_mow lives, so its imports sort as first-party

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax,
# B: likely bugs, ANN: type annotations everywhere.
select = ["E", "F", "I", "UP", "B", "ANN"]
